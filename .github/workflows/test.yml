name: "Test"

on:
  push:
  pull_request:

jobs:
  test:
    name: Unit tests and Coverage (Node ${{ matrix.node }})
    runs-on: "ubuntu-latest"
    strategy:
      matrix:
        node:
          - 18
          - 20
          - 22
          - 24
          - 26
    steps:
      - uses: taiki-e/checkout-action@7d1e50e93dc4fb3bba58f85018fadf77898aee8b # v1.4.2

      - uses: voidzero-dev/setup-vp@v1.21.2
        with:
          node-version: ${{ matrix.node }}
          cache: true
      - run: vp install

      - run: vp run build
      - run: vp check
      - run: vp test --coverage
