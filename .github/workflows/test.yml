name: "Test"

on:
  push:
  pull_request:

jobs:
  test:
    name: "Lint, Unit tests and Coverage"
    runs-on: "ubuntu-latest"
    steps:
      - uses: taiki-e/checkout-action@7d1e50e93dc4fb3bba58f85018fadf77898aee8b # v1.4.2

      - uses: voidzero-dev/setup-vp@v1.21.2
        with:
          node-version: ${{ matrix.node }}
          cache: true
      - run: vp install

      - run: vp run build
      - run: vp check
      - run: vp test --coverage
      - run: vpr test:dist

      - uses: actions/upload-artifact@v7
        with:
          name: build
          path: |
            dist/
            demo.js
          retention-days: 1

  node-compat:
    needs: test
    name: "Test compatibility with Node ${{ matrix.node }}"
    runs-on: "ubuntu-latest"
    strategy:
      matrix:
        node:
          - 18
          - 20
          - 22
          - 24
          - 26
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: build

      - uses: actions/setup-node@v7
        with:
          node-version: "${{ matrix.node }}"

      - run: node demo.js
